<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Imágenes de Perrito 🐶</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff3df;
            text-align: center;
        }

        header {
            background: #8b5e3c;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 40px 20px;
        }

        .perrito {
            width: 350px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐶 Imágenes de Perrito 🐶</h1>
    </header>

    <main>

        <h2>¡Bienvenido!</h2>

        <p>
            Esta es mi página de imágenes de perritos.
        </p>

        <img
            class="perrito"
            src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80"
            alt="Perrito">

        <p>🐾 Gracias por visitar 🐾</p>

    </main>
<script>

fetch("/api/visit", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        pagina: location.pathname
    })
});

</script>
</body>

</html>
