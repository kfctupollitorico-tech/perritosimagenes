```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de visitas 🐶</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff3df;
            color: #333;
        }

        header {
            background: #8b5e3c;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            padding: 30px;
        }

        .contador {
            background: white;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            font-size: 20px;
        }

        .tabla-contenedor {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #8b5e3c;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #fff8ef;
        }

        #mensaje {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐶 Panel de visitas</h1>
        <p>Imágenes de Perrito</p>
    </header>

    <main>

        <div class="contador">
            👀 Visitas registradas:
            <strong id="total">Cargando...</strong>
        </div>

        <div class="tabla-contenedor">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>IP</th>
                        <th>Fecha y hora</th>
                        <th>Navegador</th>
                        <th>Página</th>
                    </tr>
                </thead>

                <tbody id="tabla-visitas">
                </tbody>

            </table>

        </div>

        <div id="mensaje"></div>

    </main>

    <script>

        async function cargarVisitas() {

            const tabla = document.getElementById("tabla-visitas");
            const total = document.getElementById("total");
            const mensaje = document.getElementById("mensaje");

            try {

                const respuesta = await fetch("/api/visitas");

                if (!respuesta.ok) {
                    throw new Error("Error HTTP: " + respuesta.status);
                }

                const visitas = await respuesta.json();

                tabla.innerHTML = "";

                total.textContent = visitas.length;

                visitas.forEach(function(visita, indice) {

                    const fila = document.createElement("tr");

                    fila.innerHTML = `
                        <td>${indice + 1}</td>
                        <td>${visita.ip}</td>
                        <td>${new Date(visita.fecha).toLocaleString("es-PE")}</td>
                        <td>${visita.navegador}</td>
                        <td>${visita.pagina}</td>
                    `;

                    tabla.appendChild(fila);

                });

                mensaje.textContent = "";

            } catch (error) {

                console.error(error);

                total.textContent = "Error";

                mensaje.textContent =
                    "❌ No se pudieron cargar las visitas. Error: " + error.message;

            }

        }

        cargarVisitas();

    </script>

</body>

</html>
```
